<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ØNation - Registrazione Evento</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>

    <div class="registration-wrapper">
        <img src="logobianco_verticale.png" alt="ØNation Logo" class="form-logo">
        <p class="event-title">Pool Party 19/07/2026<br>Dalle 14:00 alle 22:30
        </p>

        <div class="countdown" id="countdown" role="timer">
            
            <div class="countdown-timer">
                <div class="countdown-unit">
                    <span class="countdown-number" id="cd-days">00</span>
                    <span class="countdown-text">Giorni</span>
                </div>
                <div class="countdown-unit">
                    <span class="countdown-number" id="cd-hours">00</span>
                    <span class="countdown-text">Ore</span>
                </div>
                <div class="countdown-unit">
                    <span class="countdown-number" id="cd-minutes">00</span>
                    <span class="countdown-text">Minuti</span>
                </div>
                <div class="countdown-unit">
                    <span class="countdown-number" id="cd-seconds">00</span>
                    <span class="countdown-text">Secondi</span>
                </div>
            </div>
            <p class="countdown-closed" id="countdown-closed">Lista chiusa</p>
        </div>

        <div class="form-card">
            <h2>GUEST LIST</h2>
            <p class="form-subtitle">Inserisci i tuoi dati per registrarti all'evento.</p>
            
            <form id="onation-form">
                
                <div class="input-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Digita il tuo nome" required>
                </div>
                
                <div class="input-group">
                    <label for="cognome">Cognome</label>
                    <input type="text" id="cognome" name="cognome" placeholder="Digita il tuo cognome" required>
                </div>
                
                <div class="input-group">
                    <label for="email">Indirizzo Email</label>
                    <input type="email" id="email" name="email" placeholder="email@provider.com" required>
                    <span class="email-note">Ti invieremo qui la conferma di registrazione.</span>
                </div>
                
                <button type="submit" class="cta-button">REGISTRATI ORA</button>

            </form>

            <div id="form-message" class="form-message"></div>
        </div>
    </div>
<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzPTFag_jUIacZHK422YFd2MEKtqJGA2yioQO2o3eIGMTtvbrM1lSIuYd_9d1I7SN4o/exec';
    const form = document.getElementById('onation-form');
    const msgBox = document.getElementById('form-message');

    form.addEventListener('submit', e => {
        e.preventDefault();

        const btn = form.querySelector('button');
        btn.innerText = "INVIO IN CORSO...";
        btn.disabled = true;
        msgBox.className = 'form-message';
        msgBox.textContent = '';

        fetch(scriptURL, {
            method: 'POST',
            body: JSON.stringify({
                nome: form.nome.value,
                cognome: form.cognome.value,
                email: form.email.value
            })
        })
        .then(response => {
            if (!response.ok) throw new Error('HTTP ' + response.status);
            msgBox.className = 'form-message success';
            msgBox.textContent = 'Registrazione completata! Controlla la tua email.';
            form.reset();
        })
        .catch(error => {
            console.error('Errore!', error.message);
            msgBox.className = 'form-message error';
            msgBox.textContent = 'Si è verificato un errore. Riprova più tardi.';
        })
        .finally(() => {
            btn.innerText = "REGISTRATI ORA";
            btn.disabled = false;
        });
    });
</script>

<script>
    // Mezzanotte tra il 17 e il 18 luglio 2026, ora italiana (CEST, UTC+2).
    const countdownTarget = new Date('2026-07-18T00:00:00+02:00').getTime();

    const cd = {
        days: document.getElementById('cd-days'),
        hours: document.getElementById('cd-hours'),
        minutes: document.getElementById('cd-minutes'),
        seconds: document.getElementById('cd-seconds')
    };
    const countdownEl = document.getElementById('countdown');

    const pad = n => String(n).padStart(2, '0');

    let countdownInterval;

    function updateCountdown() {
        const diff = countdownTarget - Date.now();

        if (diff <= 0) {
            cd.days.textContent = '00';
            cd.hours.textContent = '00';
            cd.minutes.textContent = '00';
            cd.seconds.textContent = '00';
            countdownEl.classList.add('is-closed');
            if (countdownInterval) clearInterval(countdownInterval);
            return;
        }

        cd.days.textContent = pad(Math.floor(diff / 86400000));
        cd.hours.textContent = pad(Math.floor((diff % 86400000) / 3600000));
        cd.minutes.textContent = pad(Math.floor((diff % 3600000) / 60000));
        cd.seconds.textContent = pad(Math.floor((diff % 60000) / 1000));
    }

    updateCountdown();
    countdownInterval = setInterval(updateCountdown, 1000);
</script>

</body>
</html>
